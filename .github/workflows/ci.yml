name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Observed p95 for this job is well under a minute; floor of 10 applies.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # fmt, clippy and test are three independent verdicts. Left as a plain step
      # chain, the first one to fail cancels the other two and hides their results,
      # so a formatting nit masks whether the tests pass. `!cancelled()` lets each
      # report its own result; any failure still fails the job.
      - name: cargo clippy
        if: '!cancelled()'
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        if: '!cancelled()'
        run: cargo test --all-targets

  nix:
    runs-on: ubuntu-latest
    # Observed p95 for this job is ~10m (it compiles the crate); ~3x that.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      # Both commands are here on purpose -- neither subsumes the other.
      # `nix flake check` builds the `checks` output (checks/default.nix's
      # eval-time module assertions) but only *evaluates* `packages`, so it
      # never compiles the Rust crate. `nix build .#nixnet` builds the
      # derivation and therefore runs the Rust test suite in its checkPhase,
      # but never touches the `checks` output. Drop either one and a whole
      # half of the repo silently stops being tested.
      #
      # For the same reason they must not mask each other: a failing `flake check`
      # would otherwise cancel the build step and hide whether the crate still
      # compiles and its tests still pass. `!cancelled()` keeps both verdicts.
      - name: nix flake check
        run: nix flake check --keep-going --print-build-logs
      - name: nix build .#nixnet
        if: '!cancelled()'
        run: nix build .#nixnet --print-build-logs
