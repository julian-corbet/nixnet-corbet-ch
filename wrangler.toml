name = "nixnet"
compatibility_date = "2026-07-24"

# Static project page — Cloudflare Worker static assets (same shape as the
# sibling project sites). Content lives in ./site.
#
# No [[routes]]/custom_domain block here (unlike sibling repos' wrangler.toml)
# — this is a public repo and a custom-domain route would hardcode a private
# domain into version control. Wire up the route out-of-band when this site
# is actually deployed.
[assets]
directory = "./site"
html_handling = "auto-trailing-slash"
