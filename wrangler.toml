name = "nixnet"
compatibility_date = "2026-07-25"

# Static project page — Cloudflare Worker static assets (same shape as the
# sibling project sites). Links the central foss/v1 design + local theme.css.
[assets]
directory = "./site"
# Pinned rather than left to the platform default, matching the sibling sites.
html_handling = "auto-trailing-slash"

[[routes]]
pattern = "nixnet.corbet.ch"
custom_domain = true
